<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hellopinky — оплата заказа</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-wrapper">
    <header class="brand-header">
      <div class="brand-logo">hp</div>
      <h1>hellopinky</h1>
    </header>

    <main class="pay-card">
      <form id="paymentForm" onsubmit="handlePayment(event)">
        
        <!-- БЛОК ВКЛАДОК (Исправлены атрибуты type и добавлены data-type) -->
        <div class="tabs" style="display: flex; gap: 10px; margin-bottom: 20px;">
          <button type="button" class="tab-btn active" data-type="main" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ff4d85; background: #ff4d85; color: white; cursor: pointer;">Основные оплаты</button>
          
          <button type="button" class="tab-btn" data-type="preorder" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ff4d85; background: transparent; color: #ff4d85; cursor: pointer;">Предзаказы</button>
          
          <button type="button" class="tab-btn" data-type="delivery" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ff4d85; background: transparent; color: #ff4d85; cursor: pointer;">Доставка Ozon</button>
        </div>

        <div class="form-group">
          <label for="itemInput">Ваши позиции</label>
          <input type="text" id="itemInput" class="form-control" placeholder="Например: Заказ в магазине hellopinky" required />
        </div>

        <div class="form-group">
          <label for="amountInput">Сумма (₽)</label>
          <input type="number" id="amountInput" class="form-control" placeholder="Введите сумму" min="1" step="1" oninput="updateTotal()" required />
        </div>

        <div class="form-group">
          <label for="emailInput">E-mail для чека</label>
          <input type="email" id="emailInput" class="form-control" placeholder="client@hellopinky.ru" required />
        </div>

        <!-- БЛОК ПОЛЕЙ ДОСТАВКИ -->
        <div id="deliveryFields" style="display: none; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #fbe6f0;">
          
          <div class="form-group">
            <label>Пункт выдачи Ozon</label>
            <button type="button" id="openOzonMapBtn" class="form-control" style="background: #fbe6f0; color: #b05c8a; border: 1px dashed #b05c8a; cursor: pointer; text-align: center; padding: 12px; font-weight: bold; transition: 0.2s;" onclick="openOzonWidget()">
              📍 Выбрать пункт на карте
            </button>
            <input type="hidden" id="pvzIdInput" value="" />
            <div id="selectedPvzAddress" style="font-size: 13px; margin-top: 10px; color: #333; display: none;"></div>
          </div>
          
          <div class="delivery-info" id="deliveryInfoBox" style="display: none; font-size: 14px; color: #b05c8a; margin-top: 15px; padding: 12px; background: #fbe6f0; border-radius: 8px;">
            🚚 Стоимость логистики: <span id="deliveryCostDisplay">считаем...</span>
          </div>
        </div>

        <!-- Всплывающее окно (Модалка) для карты Ozon -->
        <div id="ozonWidgetModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999;">
           <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 95%; max-width: 900px; height: 85%; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
              <div style="padding: 15px; background: #fff; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;">
                 <strong style="color: #333;">Выберите пункт выдачи</strong>
                 <button type="button" onclick="closeOzonWidget()" style="padding: 6px 12px; background: #ff4d85; color: white; border: none; border-radius: 6px; cursor: pointer;">Закрыть</button>
              </div>
              <!-- Сюда встраивается iframe виджета Ozon -->
              <div id="ozonMapContainer" style="width: 100%; height: calc(100% - 50px); background: #fafafa;"></div>
           </div>
        </div>

        <div class="total-box">
          <span class="total-box-label">Итого по чеку:</span>
          <span class="total-box-amount" id="totalAmountDisplay">0 ₽</span>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">
          ПЕРЕЙТИ К ОПЛАТЕ
        </button>
      </form>
    </main>
  </div>

  <div class="toast" id="toastBox"></div>
  <script src="script.js"></script>
</body>
</html>
