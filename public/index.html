<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hellopinky — оплата заказа</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-wrapper">
    <header class="brand-header">
      <div class="brand-logo">hp</div>
      <h1>hellopinky</h1>
    </header>

    <main class="pay-card">
      <form id="paymentForm" onsubmit="handlePayment(event)">
        
        <div class="tabs" style="display: flex; gap: 10px; margin-bottom: 20px;">
          <button type="button" class="tab-btn active" data-type="main" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ff4d85; background: #ff4d85; color: white; cursor: pointer; font-size: 13px;">Основные оплаты</button>
          
          <!-- ВОТ ОНА, ВКЛАДКА ПРЕДЗАКАЗОВ -->
          <button type="button" class="tab-btn" data-type="preorder" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ff4d85; background: transparent; color: #ff4d85; cursor: pointer; font-size: 13px;">Предзаказы</button>
          
          <button type="button" class="tab-btn" data-type="delivery" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ff4d85; background: transparent; color: #ff4d85; cursor: pointer; font-size: 13px;">Доставка Ozon</button>
        </div>

        <div id="productFields">
          <div class="form-group">
            <label for="itemInput">Ваши позиции</label>
            <input type="text" id="itemInput" class="form-control" placeholder="Например: Заказ в магазине hellopinky" required />
          </div>
          <div class="form-group">
            <label for="amountInput">Сумма (₽)</label>
            <input type="number" id="amountInput" class="form-control" placeholder="Введите сумму" min="1" step="1" oninput="updateTotal()" required />
          </div>
        </div>

        <div id="deliveryFields" style="display: none;">
          <div class="form-group">
            <label for="tgInput">Юзернейм в Telegram</label>
            <input type="text" id="tgInput" class="form-control" placeholder="Например: @hellopinky" onchange="calculateDelivery()" />
          </div>
          
          <!-- ВОТ ОНО, ПОЛЕ ТЕЛЕФОНА -->
          <div class="form-group" style="padding-top: 10px;">
            <label for="phoneInput">Телефон получателя</label>
            <input type="tel" id="phoneInput" class="form-control" placeholder="+7 999 000-00-00" onchange="calculateDelivery()" />
          </div>

          <div class="form-group" style="padding-top: 10px;">
            <label for="pvzAddressInput">Адрес ПВЗ Ozon</label>
            <input type="text" id="pvzAddressInput" class="form-control" placeholder="Город и улица, например: Екатеринбург Ленина 10" onchange="calculateDelivery()" />
          </div>
          
          <div class="delivery-info" id="deliveryInfoBox" style="display: none; font-size: 14px; color: #b05c8a; margin-top: 15px; padding: 12px; background: #fbe6f0; border-radius: 8px;">
            🚚 Стоимость логистики с упаковкой: <span id="deliveryCostDisplay" style="font-weight: bold;">считаем...</span>
          </div>
        </div>

        <div class="form-group" style="margin-top: 15px;">
          <label for="emailInput">E-mail для чека</label>
          <input type="email" id="emailInput" class="form-control" placeholder="client@hellopinky.ru" required />
        </div>

        <div class="total-box">
          <span class="total-box-label">Итого по чеку:</span>
          <span class="total-box-amount" id="totalAmountDisplay">0 ₽</span>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">ПЕРЕЙТИ К ОПЛАТЕ</button>
      </form>
    </main>
  </div>

  <div class="toast" id="toastBox"></div>
  <script src="script.js"></script>
</body>
</html>
