<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hellopinky — оплата заказа</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-wrapper">
    <header class="brand-header">
      <div class="brand-logo">hp</div>
      <h1>hellopinky</h1>
    </header>

    <main class="pay-card">
      <form id="paymentForm" onsubmit="handlePayment(event)">
        
        <div class="tabs-wrapper">
          <button type="button" class="tab-btn active" data-type="main">Основные оплаты</button>
          <button type="button" class="tab-btn" data-type="preorder">Предзаказы</button>
        </div>

        <div class="form-group">
          <label for="itemInput">Ваши позиции</label>
          <input type="text" id="itemInput" class="form-control" placeholder="Например: Заказ в магазине hellopinky" required />
        </div>

        <div class="form-group">
          <label for="amountInput">Сумма (₽)</label>
          <input type="number" id="amountInput" class="form-control" placeholder="Введите сумму" min="1" step="1" oninput="updateTotal()" required />
        </div>

        <div class="form-group">
          <label for="emailInput">E-mail для чека</label>
          <input type="email" id="emailInput" class="form-control" placeholder="client@hellopinky.ru" required />
        </div>

        <div class="total-box">
          <span class="total-box-label">Итого:</span>
          <span class="total-box-amount" id="totalAmountDisplay">0 ₽</span>
        </div>

        <!-- Новый независимый блок доставки -->
        <div class="delivery-block" style="margin-top: 20px; padding: 20px; border: 2px solid #fbe6f0; border-radius: 12px; background-color: #fff;">
            <h3 style="margin-top: 0; font-size: 16px; color: #333; margin-bottom: 15px;">📦 Доставка Ozon для бизнеса</h3>
            
            <div class="form-group" style="margin-bottom: 0;">
                <label for="cityInput">Город получателя</label>
                <input type="text" id="cityInput" class="form-control" placeholder="Например: Москва" onchange="calculateDelivery()" />
            </div>
            
            <div class="delivery-info" id="deliveryInfoBox" style="display: none; font-size: 14px; font-weight: 500; color: #b05c8a; margin-top: 15px; padding: 12px; background: #fbe6f0; border-radius: 8px;">
                🚚 Расчетная стоимость: <span id="deliveryCostDisplay">считаем...</span>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">
          ПЕРЕЙТИ К ОПЛАТЕ
        </button>
      </form>
    </main>
  </div>

  <div class="toast" id="toastBox"></div>
  <script src="script.js"></script>
</body>
</html>
